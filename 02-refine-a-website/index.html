<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Homepage</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400&family=Space+Mono&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  
</head>

<body>

  <div class="sky" aria-hidden="true">
    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>
    <div class="cloud cloud-3"></div>
    <div class="cloud cloud-4"></div>
    <div class="cloud cloud-5"></div>
  </div>

  <div class="liminal-pool" aria-hidden="true"></div>

  <div class="vhs-overlay" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <main class="bubble-field" aria-label="homepage">
    <button type="button" class="bubble" data-letter="h" style="--x: 14%; --y: 22%;" aria-label="Open Home">h</button>
    <button type="button" class="bubble" data-letter="o" style="--x: 28%; --y: 38%;" aria-label="Open Origin">0</button>
    <button type="button" class="bubble" data-letter="m" style="--x: 44%; --y: 18%;" aria-label="Open Motivation">m</button>
    <button type="button" class="bubble" data-letter="e" style="--x: 58%; --y: 42%;" aria-label="Open Methodology">3</button>
    <button type="button" class="bubble" data-letter="p" style="--x: 72%; --y: 24%;" aria-label="Open Project">p</button>
    <button type="button" class="bubble" data-letter="a" style="--x: 22%; --y: 58%;" aria-label="Open Abstract">@</button>
    <button type="button" class="bubble" data-letter="g" style="--x: 50%; --y: 62%;" aria-label="Open Gallery">g</button>
    <button type="button" class="bubble" data-letter="e2" style="--x: 78%; --y: 55%;" aria-label="Open Interactive Demo">e</button>
  </main>

  <div id="popupLayer" class="popup-layer" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
